[versions]
agp = "8.4.2"
kotlin = "1.9.22"

# Downgraded versions
core-ktx     = "1.13.1"
lifecycle    = "2.8.1"
transition   = "1.5.1"
navigation   = "2.7.7"
room         = "2.6.1"
work         = "2.9.0"
exoplayer    = "2.19.1"
coil         = "2.5.0"
hilt         = "2.51.1"

# Firebase – using versions that work with SDK 34
firebase-auth     = "21.0.1"
firebase-firestore = "24.9.0"
firebase-storage  = "20.3.0"

datastore = "1.0.0"
palette = "1.0.0"
material-icons-extended = "1.6.8"   # same version as Compose
hilt-navigation-compose = "1.2.0"

# Compose
compose-bom        = "2024.02.00"
compose-compiler   = "1.5.14"
material3          = "1.2.1"

# Testing
junit        = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat    = "1.6.1"
material     = "1.10.0"

paging = "3.2.1"

[libraries]
# AndroidX
androidx-core-ktx                      = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-compose     = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose   = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-transition                    = { module = "androidx.transition:transition", version.ref = "transition" }
androidx-navigation-compose            = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Room
androidx-room-runtime  = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx      = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# WorkManager
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# ExoPlayer
com-google-exoplayer = { module = "com.google.android.exoplayer:exoplayer", version.ref = "exoplayer" }

# Coil
io-coil-kt-coil-compose = { module = "io-coil-kt:coil-compose", version.ref = "coil" }

# Hilt
dagger-hilt-android           = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
dagger-hilt-android-compiler  = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# Compose BOM
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }

# Compose artifacts (no versions, from BOM)
androidx-compose-ui                  = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3           = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-foundation          = { module = "androidx.compose.foundation:foundation" }
androidx-compose-runtime             = { module = "androidx.compose.runtime:runtime" }
androidx-compose-animation           = { module = "androidx.compose.animation:animation" }

# ------------------------------------------------------------------
# Firebase – uncommented and versioned
# ------------------------------------------------------------------
google-firebase-auth     = { module = "com.google.firebase:firebase-auth-ktx", version.ref = "firebase-auth" }
google-firebase-firestore = { module = "com.google.firebase:firebase-firestore-ktx", version.ref = "firebase-firestore" }
google-firebase-storage  = { module = "com.google.firebase:firebase-storage-ktx", version.ref = "firebase-storage" }

com-google-exoplayer-core = { module = "com.google.android.exoplayer:exoplayer-core", version.ref = "exoplayer" }
com-google-exoplayer-mediasession = { module = "com.google.android.exoplayer:extension-mediasession", version.ref = "exoplayer" }
com-google-exoplayer-ui = { module = "com.google.android.exoplayer:exoplayer-ui", version.ref = "exoplayer" }

# DataStore
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Palette
androidx-palette = { module = "androidx.palette:palette", version.ref = "palette" }

# Material Icons Extended (for icons like History, LibraryMusic, Chat, etc.)
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-icons-extended" }

# Hilt Navigation Compose
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Testing
junit                  = { module = "junit:junit", version.ref = "junit" }
androidx-junit         = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-appcompat     = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material               = { module = "com.google.android.material:material", version.ref = "material" }

androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt         = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
dagger-hilt         = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
